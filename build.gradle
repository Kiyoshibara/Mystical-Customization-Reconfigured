plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.blakebr0.mysticalcustomization'

base {
    archivesName = "Mystical-Customization-Reconfigured-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenLocal {
        content {
            includeModule 'com.blakebr0.cucumber', 'Cucumber'
            includeModule 'com.blakebr0.mysticalagriculture', 'MysticalAgriculture'
        }
    }

    maven { url 'https://maven.blamejared.com' }

    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

tasks.register('syncTestConfigs', Sync) {
    from 'src/test/resources/config'
    into 'run/config'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'terminal.jline', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
            ideName = "MysticalCustomization - ${it.ideName.get()}"

            // The bundled test fixtures include deliberately invalid JSON.
            // Use ./gradlew syncTestConfigs explicitly when testing error reporting.
        }
    }

    mods {
        mysticalcustomization {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.blakebr0.cucumber:Cucumber:${cucumber_version}"
    implementation "com.blakebr0.mysticalagriculture:MysticalAgriculture:${mysticalagriculture_version}"
}

java.withSourcesJar()

tasks.withType(ProcessResources).configureEach {
    exclude '**/*.bak'
    exclude '**/.cache/**'

    var replaceProperties = [
        mod_version: project.version.toString(),
        cucumber_version: cucumber_version,
        mysticalagriculture_version: mysticalagriculture_version
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(Jar).configureEach {
    exclude '**/*.bak'
    exclude '**/.cache/**'

    from('LICENSE') {
        into 'META-INF'
    }
}